name: Golden re-bless (post-merge)

# After a merge to main, re-capture the golden baseline and VERIFY it matches the
# committed goldens. It no longer rewrites main: any drift fails the job (a loud
# signal that something shipped without an in-PR re-bless) and uploads the
# re-captured goldens as an artifact for a reviewed follow-up re-bless PR.
on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency: golden-rebless

jobs:
  rebless:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    env:
      APP_ORIGIN: "http://localhost:5000"
      API_BASE: "http://localhost:5000/api"
      SPEC_CANDIDATES: "/api/v1/swagger.json"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression CLI
        run: python3 -m pip install ./tools/api-regression

      - name: Start database
        run: docker compose -f compose.yaml up -d

      - name: Migrate (db fresh) & run app
        run: |
          ( cd tools/Conduit.Tools && dotnet run -- db fresh )
          ( cd src/Conduit.WebUI \
            && ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://localhost:5000 \
               dotnet run --no-launch-profile > /tmp/app.log 2>&1 & )
          for i in $(seq 1 90); do
            curl -fsS "${APP_ORIGIN}${SPEC_CANDIDATES}" -o /dev/null 2>/dev/null && { echo ready; break; }
            sleep 2
          done

      - name: Re-capture goldens
        run: |
          dotnet-api-regression golden capture \
            --corpus tools/api-regression/corpus.realworld.json \
            --base-url "$API_BASE" \
            --normalize tools/api-regression/normalize.config.json \
            --out goldens

      # Drift = a merged change altered a happy-path response without an in-PR
      # re-bless. The PR golden gate makes this rare; when it happens it is a real
      # signal (resolver gap or non-determinism), so FAIL loudly instead of
      # silently rewriting main. The re-captured goldens are uploaded for review.
      - name: Verify goldens current (no silent drift)
        run: |
          if git diff --quiet -- goldens/; then
            echo "goldens already current — shipped behaviour matches the baseline."
          else
            echo "::error::Goldens drifted: a merged change altered a happy-path"
            echo "::error::response without an in-PR re-bless. Review the diff, then"
            echo "::error::commit the re-captured goldens via a follow-up PR (GOLDEN.md)."
            git --no-pager diff -- goldens/ || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebless-goldens
          path: goldens/

      - name: Stop
        if: always()
        run: |
          pkill -f Conduit.WebUI 2>/dev/null || true
          docker compose -f compose.yaml down -v 2>/dev/null || true
