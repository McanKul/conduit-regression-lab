name: API Regression

on:
  pull_request:
    branches: [ main ]          # this repo's default branch

permissions:
  contents: read
  pull-requests: write

env:
  # The app serves the API under /api (MapGroup("/api")); the OpenAPI document
  # is SERVER-RELATIVE: servers=[{url:"/api"}] and paths are stripped of /api.
  # So the spec base that actually hits endpoints is origin + /api.
  APP_ORIGIN: "http://localhost:5000"
  API_BASE: "http://localhost:5000/api"
  # RealWorld registers at POST /api/users and returns .user.token; the scheme
  # is "Token" (NOT Bearer) -> Authorization: Token <jwt>.
  REGISTER_URL: "http://localhost:5000/api/users"
  AUTH_SCHEME: "Token"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install regression CLI
        run: python3 -m pip install ./tools/api-regression

      - name: Test regression CLI
        run: python3 -m unittest discover -s tools/api-regression -p 'test_*.py'

      - name: Test Roslyn analyzer
        run: dotnet run --project tools/DotnetApiRegression.Analyzer.Tests --nologo

      # Postgres (dev DB on :5433 + integration-test DB on :5434) from the repo's compose.
      - name: Start databases
        run: docker compose -f compose.yaml up -d

      # ---- BASE branch spec: run base app from a worktree, fetch, stop --------
      # Run from the project dir with --no-launch-profile so the content root
      # finds appsettings*.json and we bind plain http on :5000 (skips the
      # https:5001 dev-cert binding). Development => auto-migrate on startup.
      - name: Base spec
        run: |
          mkdir -p specs
          git worktree add ../base "origin/${{ github.base_ref }}"
          ( cd ../base/src/Conduit.WebUI \
            && ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://localhost:5000 \
               dotnet run --no-launch-profile > /tmp/base.log 2>&1 & )
          dotnet-api-regression openapi capture \
            --output specs/base.json \
            --url "${APP_ORIGIN}/api/v1/swagger.json" --wait-seconds 180 \
            --search-root ../base \
            --project ../base/src/Conduit.WebUI/Conduit.WebUI.csproj \
            || { echo '--- base log ---'; cat /tmp/base.log; exit 1; }
          dotnet-api-regression analyze \
            --root ../base \
            --project src/Conduit.WebUI/Conduit.WebUI.csproj \
            --output "$(pwd)/specs/base-semantic-index.json"
          pkill -f Conduit.WebUI 2>/dev/null || true
          sleep 5

      # ---- PR branch: migrate + wipe (ephemeral DB) then run; keep up for fuzz -
      # Use `db fresh` (migrate + truncate), NOT `db seed`: the app's random
      # faker seeder occasionally inserts a duplicate tag name (23505 on the
      # IX_Tags_Name unique index) -> flaky CI. The golden corpus self-generates
      # its data and the fuzz layer generates its own, so a clean migrated DB is
      # both sufficient and fully deterministic. (App source is left untouched.)
      - name: Migrate & run PR app
        run: |
          ( cd tools/Conduit.Tools && dotnet run -- db fresh )
          ( cd src/Conduit.WebUI \
            && ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://localhost:5000 \
               dotnet run --no-launch-profile > /tmp/pr.log 2>&1 & )
          dotnet-api-regression openapi capture \
            --output specs/revision.json \
            --url "${APP_ORIGIN}/api/v1/swagger.json" --wait-seconds 180 \
            --search-root . \
            --project src/Conduit.WebUI/Conduit.WebUI.csproj \
            || { echo '--- pr log ---'; cat /tmp/pr.log; exit 1; }

      - name: Build Roslyn semantic index
        run: |
          dotnet-api-regression analyze \
            --root . --project src/Conduit.WebUI/Conduit.WebUI.csproj \
            --output specs/revision-semantic-index.json

      # ---- Impact = spec-diff U source-impact U migration-impact -------------
      - name: Resolve impacted endpoints
        run: |
          dotnet-api-regression impact \
            --base "origin/${{ github.base_ref }}" --head HEAD \
            --spec specs/revision.json --base-spec specs/base.json \
            --semantic-index specs/revision-semantic-index.json \
            --base-semantic-index specs/base-semantic-index.json \
            --config tools/api-regression/impact.config.json --out-dir specs
          echo "Impacted:"; cat specs/impacted-paths.txt || true

      - name: Breaking-change gate
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: specs/base.json
          revision: specs/revision.json
          fail-on: ERR

      # Golden replay runs BEFORE schemathesis so the corpus hits a clean,
      # un-fuzzed DB (schemathesis mutates it) -> deterministic, flake-free gate.
      - name: Golden behaviour diff
        run: |
          if [ -d goldens ]; then
            dotnet-api-regression golden verify \
              --corpus tools/api-regression/corpus.realworld.json \
              --base-url "$API_BASE" \
              --normalize tools/api-regression/normalize.config.json \
              --goldens goldens \
              --gate-paths specs/impacted-paths.txt \
              --report golden-report.json \
              --comment-out golden-comment.md || true
          else
            echo "No goldens/ committed yet. Run capture once and commit it (see GOLDEN.md). Skipping."
          fi

      - name: Post behaviour diff as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- golden-behaviour-diff -->';
            let body = '';
            try { body = fs.readFileSync('golden-comment.md', 'utf8'); } catch (e) {}
            body = body.trim()
              ? marker + '\n' + body
              : marker + '\n✅ Bu PR hiçbir API yanıt gövdesini değiştirmiyor (golden).';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # ---- Auth: register a throwaway user, grab its token -------------------
      - name: Register & get token
        run: |
          email="regr_$(date +%s)_$RANDOM@example.com"
          body="{\"user\":{\"username\":\"regr_$RANDOM\",\"email\":\"$email\",\"password\":\"Password123!\"}}"
          TOKEN=$(curl -fsS -X POST "$REGISTER_URL" -H 'Content-Type: application/json' -d "$body" | jq -r '.user.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "registration failed"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # ---- Contract fuzz: only impacted endpoints ---------------------------
      # impacted-paths are spec-relative (/articles); schemathesis matches
      # --include-path against the server-prefixed full path, so prepend /api.
      # OpenAPI 3.1.1 needs the experimental flag on schemathesis 3.x.
      # Report-only (|| true): without a fuzz baseline it cannot tell a NEW 5xx
      # from a pre-existing spec gap, so it informs (junit artifact) but does not
      # gate. The ONLY hard gate is oasdiff (breaking); golden is advisory too.
      - name: Schemathesis on impacted endpoints
        run: |
          if [ ! -s specs/impacted-paths.txt ]; then echo "nothing impacted -> skip"; exit 0; fi
          mkdir -p schemathesis-report
          pip install 'schemathesis<4'
          ARGS=()
          while IFS= read -r p; do [ -n "$p" ] && ARGS+=( --include-path "/api${p}" ); done < specs/impacted-paths.txt
          if [ ${#ARGS[@]} -eq 0 ]; then echo "nothing to test"; exit 0; fi
          schemathesis run specs/revision.json --base-url "$API_BASE" "${ARGS[@]}" \
            --experimental=openapi-3.1 \
            -H "Authorization: $AUTH_SCHEME $API_TOKEN" \
            --checks all --junit-xml schemathesis-report/junit.xml || true

      # ---- Behavioural gate: replay golden corpus, BLOCK on any change -------
      # Golden already ran on a clean DB above (before the fuzz). Any change to
      # the locked happy-path responses fails the PR; re-bless in-PR if intended.
      - name: Golden gate (fail on any happy-path behaviour change)
        if: always()
        run: |
          if [ ! -f golden-report.json ]; then
            echo "No golden report (no goldens/ committed yet) — golden gate skipped."
            exit 0
          fi
          python3 - <<'PY'
          import json, sys
          report = json.load(open("golden-report.json"))
          diffs = report.get("diffs", [])
          if not diffs:
              print("golden gate: locked happy-path corpus unchanged.")
              sys.exit(0)
          fatal = report.get("fatal", [])
          warnings = report.get("warnings", [])
          print(f"::error::Golden gate: {len(diffs)} happy-path response(s) changed "
                f"({len(fatal)} impacted, {len(warnings)} other). If intentional, "
                f"re-bless goldens in THIS PR (see GOLDEN.md).")
          for d in diffs:
              tag = "impacted" if d["impacted"] else "other"
              print(f"  - [{tag}] {d['method']} {d['path']} ({d['id']}): "
                    f"status {d['expected_status']}->{d['actual_status']}, "
                    f"body_changed={d['body_changed']}")
          sys.exit(1)
          PY

      - name: Stop
        if: always()
        run: |
          pkill -f Conduit.WebUI 2>/dev/null || true
          docker compose -f compose.yaml down -v 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-artifacts
          path: |
            specs/
            schemathesis-report/
            golden-report.json
            golden-comment.md
