name: API Regression

on:
  pull_request:
    branches: [ main ]          # this repo's default branch

permissions:
  contents: read
  pull-requests: write

env:
  # The app serves the API under /api (MapGroup("/api")); the OpenAPI document
  # is SERVER-RELATIVE: servers=[{url:"/api"}] and paths are stripped of /api.
  # So the spec base that actually hits endpoints is origin + /api.
  APP_ORIGIN: "http://localhost:5000"
  API_BASE: "http://localhost:5000/api"
  # MapOpenApi("/api/v1/{documentName}.json"), document name = "swagger".
  SPEC_CANDIDATES: "/api/v1/swagger.json"
  # RealWorld registers at POST /api/users and returns .user.token; the scheme
  # is "Token" (NOT Bearer) -> Authorization: Token <jwt>.
  REGISTER_URL: "http://localhost:5000/api/users"
  AUTH_SCHEME: "Token"

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Postgres (dev DB on :5433 + integration-test DB on :5434) from the repo's compose.
      - name: Start databases
        run: docker compose -f compose.yaml up -d

      # Reusable spec fetcher: poll until a candidate path answers, save it.
      - name: Write spec fetcher
        run: |
          cat > /tmp/fetch-spec.sh <<'EOF'
          #!/usr/bin/env bash
          set -uo pipefail
          out="$1"
          for i in $(seq 1 90); do
            for path in $SPEC_CANDIDATES; do
              if curl -fsS "${APP_ORIGIN}${path}" -o "$out" 2>/dev/null; then
                echo "spec fetched from ${path}"; exit 0
              fi
            done
            sleep 2
          done
          echo "spec not reachable on any candidate path"; exit 1
          EOF
          chmod +x /tmp/fetch-spec.sh

      # ---- BASE branch spec: run base app from a worktree, fetch, stop --------
      # Run from the project dir with --no-launch-profile so the content root
      # finds appsettings*.json and we bind plain http on :5000 (skips the
      # https:5001 dev-cert binding). Development => auto-migrate on startup.
      - name: Base spec
        run: |
          mkdir -p specs
          git worktree add ../base "origin/${{ github.base_ref }}"
          ( cd ../base/src/Conduit.WebUI \
            && ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://localhost:5000 \
               dotnet run --no-launch-profile > /tmp/base.log 2>&1 & )
          /tmp/fetch-spec.sh specs/base.json || { echo '--- base log ---'; cat /tmp/base.log; exit 1; }
          pkill -f Conduit.WebUI 2>/dev/null || true
          sleep 5

      # ---- PR branch: migrate+seed (ephemeral DB) then run; keep up for fuzz --
      - name: Seed & run PR app
        run: |
          ( cd tools/Conduit.Tools && dotnet run -- db seed )
          ( cd src/Conduit.WebUI \
            && ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://localhost:5000 \
               dotnet run --no-launch-profile > /tmp/pr.log 2>&1 & )
          /tmp/fetch-spec.sh specs/revision.json || { echo '--- pr log ---'; cat /tmp/pr.log; exit 1; }

      # ---- Impact = spec-diff U source-impact U migration-impact -------------
      - name: Resolve impacted endpoints
        run: |
          python3 tools/api-regression/impact_resolver.py \
            --base "origin/${{ github.base_ref }}" --head HEAD \
            --spec specs/revision.json --base-spec specs/base.json \
            --config tools/api-regression/impact.config.json --out-dir specs
          echo "Impacted:"; cat specs/impacted-paths.txt || true

      - name: Breaking-change gate
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: specs/base.json
          revision: specs/revision.json
          fail-on: ERR

      # ---- Auth: register a throwaway user, grab its token -------------------
      - name: Register & get token
        run: |
          email="regr_$(date +%s)_$RANDOM@example.com"
          body="{\"user\":{\"username\":\"regr_$RANDOM\",\"email\":\"$email\",\"password\":\"Password123!\"}}"
          TOKEN=$(curl -fsS -X POST "$REGISTER_URL" -H 'Content-Type: application/json' -d "$body" | jq -r '.user.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then echo "registration failed"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # ---- Contract fuzz: only impacted endpoints ---------------------------
      # impacted-paths are spec-relative (/articles); schemathesis matches
      # --include-path against the server-prefixed full path, so prepend /api.
      # OpenAPI 3.1.1 needs the experimental flag on schemathesis 3.x.
      # Report-only (|| true): without a fuzz baseline it cannot tell a NEW 5xx
      # from a pre-existing spec gap, so it informs (junit artifact) but does not
      # gate. The hard gates stay strict: oasdiff (breaking) + golden (behaviour).
      - name: Schemathesis on impacted endpoints
        run: |
          if [ ! -s specs/impacted-paths.txt ]; then echo "nothing impacted -> skip"; exit 0; fi
          mkdir -p schemathesis-report
          pip install 'schemathesis<4'
          ARGS=()
          while IFS= read -r p; do [ -n "$p" ] && ARGS+=( --include-path "/api${p}" ); done < specs/impacted-paths.txt
          if [ ${#ARGS[@]} -eq 0 ]; then echo "nothing to test"; exit 0; fi
          schemathesis run specs/revision.json --base-url "$API_BASE" "${ARGS[@]}" \
            --experimental=openapi-3.1 \
            -H "Authorization: $AUTH_SCHEME $API_TOKEN" \
            --checks all --junit-xml schemathesis-report/junit.xml || true

      # ---- Behavioural regression: replay golden corpus, gate on impacted ----
      - name: Golden replay
        run: |
          if [ -d goldens ]; then
            python3 tools/api-regression/golden_runner.py verify \
              --corpus tools/api-regression/corpus.realworld.json \
              --base-url "$API_BASE" \
              --normalize tools/api-regression/normalize.config.json \
              --goldens goldens \
              --gate-paths specs/impacted-paths.txt \
              --report golden-report.json
          else
            echo "No goldens/ committed yet. Run capture once and commit it (see GOLDEN.md). Skipping."
          fi

      - name: Stop
        if: always()
        run: |
          pkill -f Conduit.WebUI 2>/dev/null || true
          docker compose -f compose.yaml down -v 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-artifacts
          path: |
            specs/
            schemathesis-report/
            golden-report.json
